# API-шлюз (§13): единая точка входа :8080, маршрутизация по префиксу, Swagger UI сервисов.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # иконки предметов – до 512 КБ, остальное – JSON
  client_max_body_size 2m;

  # DNS Docker: имя сервиса переразрешается каждые 10 с, поэтому пересозданный контейнер
  # с новым адресом находится без перезапуска nginx, а при --scale запросы идут по всем экземплярам
  resolver 127.0.0.11 valid=10s ipv6=off;

  # X-Request-Id клиента сохраняется, иначе nginx выдаёт свой; сервисы пишут его в ответ и в problem+json
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time req=$req_id';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80;
    server_name _;

    # HTTP/1.1 без Connection: close – соединение с сервисом держится открытым (нужно и для SSE)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # адрес сервиса – в переменной: так nginx разрешает имя при запросе, а не один раз при старте;
    # путь запроса передаётся сервису без изменений

    # users-service
    location /api/auth  { set $svc users-service:3000; proxy_pass http://$svc; }
    location /api/users { set $svc users-service:3000; proxy_pass http://$svc; }

    # pets-service
    location /api/pets       { set $svc pets-service:3000; proxy_pass http://$svc; }
    location /api/admin/pets { set $svc pets-service:3000; proxy_pass http://$svc; }

    # care-service
    location /api/items        { set $svc care-service:3000; proxy_pass http://$svc; }
    location /api/inventory    { set $svc care-service:3000; proxy_pass http://$svc; }
    location /api/purchases    { set $svc care-service:3000; proxy_pass http://$svc; }
    location /api/wallet       { set $svc care-service:3000; proxy_pass http://$svc; }
    location /api/care-actions { set $svc care-service:3000; proxy_pass http://$svc; }

    # notifications-service; поток SSE отдаётся клиенту сразу, без буфера, и живёт до часа
    location /api/notifications {
      set $svc notifications-service:3000;
      proxy_pass http://$svc;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    # Swagger UI и JSON каждого сервиса: /docs/<сервис>, /docs/<сервис>-json
    location /docs/users         { set $svc users-service:3000; proxy_pass http://$svc; }
    location /docs/pets          { set $svc pets-service:3000; proxy_pass http://$svc; }
    location /docs/care          { set $svc care-service:3000; proxy_pass http://$svc; }
    location /docs/notifications { set $svc notifications-service:3000; proxy_pass http://$svc; }

    location = / {
      return 302 /docs;
    }

    location = /docs {
      default_type text/html;
      charset utf-8;
      return 200 '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Тамагочи – API</title><body style="font-family:sans-serif;max-width:40em;margin:2em auto"><h1>Тамагочи – API</h1><ul><li><a href="/docs/users">users-service</a> – регистрация, вход, профиль</li><li><a href="/docs/pets">pets-service</a> – питомцы</li><li><a href="/docs/care">care-service</a> – предметы, магазин, кошелёк, уход</li><li><a href="/docs/notifications">notifications-service</a> – уведомления</li></ul></body></html>';
    }

    # адрес и X-Request-Id сюда не подставляются: в JSON они пришли бы без экранирования
    location / {
      default_type application/problem+json;
      charset utf-8;
      return 404 '{"type":"https://tamagotchi.local/problems/not-found","title":"Не найдено","status":404}';
    }
  }
}
