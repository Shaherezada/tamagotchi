# Запуск всей системы (§13): cp .env.example .env && npm run keys && docker compose up -d --build
# Вход – nginx на http://localhost:8080, Swagger UI – http://localhost:8080/docs.
name: tamagotchi

# общее окружение сервисов; базы, учётные записи и свои переменные – у каждого сервиса
x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  DB_HOST: postgres
  DB_PORT: 5432
  DB_MIGRATIONS_RUN: "true"
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  REDIS_URL: redis://redis:6379
  JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on: &app-depends
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

# сервис готов, когда отдаёт свой OpenAPI
x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      users-service:
        condition: service_healthy
      pets-service:
        condition: service_healthy
      care-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    restart: unless-stopped

  users-service:
    <<: *app
    image: tamagotchi/users-service:dev
    build:
      context: .
      args:
        SERVICE: users-service
    environment:
      <<: *app-env
      DB_NAME: ${USERS_DB_NAME}
      DB_USER: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    secrets:
      - jwt-public
      - jwt-private
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/docs/users-json"]

  pets-service:
    <<: *app
    image: tamagotchi/pets-service:dev
    build:
      context: .
      args:
        SERVICE: pets-service
    environment:
      <<: *app-env
      DB_NAME: ${PETS_DB_NAME}
      DB_USER: ${PETS_DB_USER}
      DB_PASSWORD: ${PETS_DB_PASSWORD}
      GRPC_PORT: 50051
      GAME_SPEED: ${GAME_SPEED}
      TICK_MS: ${TICK_MS}
      DEMO_MODE: ${DEMO_MODE}
      SILO_PUBLIC_URL: ${SILO_PUBLIC_URL}
      SILO_BUCKET: ${SILO_BUCKET}
    secrets:
      - jwt-public
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/docs/pets-json"]

  care-service:
    <<: *app
    image: tamagotchi/care-service:dev
    build:
      context: .
      args:
        SERVICE: care-service
    environment:
      <<: *app-env
      DB_NAME: ${CARE_DB_NAME}
      DB_USER: ${CARE_DB_USER}
      DB_PASSWORD: ${CARE_DB_PASSWORD}
      PETS_GRPC_URL: pets-service:50051
      SILO_ENDPOINT: http://silo:9000
      SILO_ACCESS_KEY: ${SILO_ACCESS_KEY}
      SILO_SECRET_KEY: ${SILO_SECRET_KEY}
      SILO_BUCKET: ${SILO_BUCKET}
      SILO_PUBLIC_URL: ${SILO_PUBLIC_URL}
    secrets:
      - jwt-public
    depends_on:
      <<: *app-depends
      pets-service:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/docs/care-json"]

  notifications-service:
    <<: *app
    image: tamagotchi/notifications-service:dev
    build:
      context: .
      args:
        SERVICE: notifications-service
    environment:
      <<: *app-env
      DB_NAME: ${NOTIFICATIONS_DB_NAME}
      DB_USER: ${NOTIFICATIONS_DB_USER}
      DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
    secrets:
      - jwt-public
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/docs/notifications-json"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # для db/init/01-databases.sh
      USERS_DB_NAME: ${USERS_DB_NAME}
      USERS_DB_USER: ${USERS_DB_USER}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
      PETS_DB_NAME: ${PETS_DB_NAME}
      PETS_DB_USER: ${PETS_DB_USER}
      PETS_DB_PASSWORD: ${PETS_DB_PASSWORD}
      CARE_DB_NAME: ${CARE_DB_NAME}
      CARE_DB_USER: ${CARE_DB_USER}
      CARE_DB_PASSWORD: ${CARE_DB_PASSWORD}
      NOTIFICATIONS_DB_NAME: ${NOTIFICATIONS_DB_NAME}
      NOTIFICATIONS_DB_USER: ${NOTIFICATIONS_DB_USER}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer:latest
    # по умолчанию слушает [::] – без IPv6 в Docker не стартует
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # постоянное имя узла – данные тома остаются после пересоздания контейнера
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # по методичке iu5git/Web (tutorials/silo)
  silo:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SILO_SECRET_KEY}
      MINIO_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # одноразовый: бакет tamagotchi-media с публичным чтением
  silo-init:
    image: pgsty/silo:latest
    entrypoint: ["sh", "/init/init-bucket.sh"]
    environment:
      SILO_ENDPOINT: http://silo:9000
      SILO_ACCESS_KEY: ${SILO_ACCESS_KEY}
      SILO_SECRET_KEY: ${SILO_SECRET_KEY}
      SILO_BUCKET: ${SILO_BUCKET}
    volumes:
      - ./deploy/silo:/init:ro
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"

secrets:
  jwt-public:
    file: ./secrets/jwt-public.pem
  jwt-private:
    file: ./secrets/jwt-private.pem

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  silo-data:
